<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhishGuard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="row my-3">
      <div class="col">
        <h3 class="text-center"><i class="fas fa-shield-alt"></i> PhishGuard</h3>
        <p class="text-center text-muted small">ML-powered phishing URL detection</p>
      </div>
    </div>

    <!-- Current page status -->
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Current Page</h5>
        <div id="current-url-container">
          <p id="current-url" class="text-truncate mb-2">Loading...</p>
          <div class="d-flex align-items-center">
            <div id="status-indicator" class="status-indicator status-loading me-2"></div>
            <p id="status-text" class="mb-0">Checking...</p>
          </div>
        </div>
        <div id="scan-details" class="mt-3 d-none">
          <div class="row">
            <div class="col-6">
              <p class="mb-1 small text-muted">ML Confidence:</p>
              <div class="progress">
                <div id="ml-confidence" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">0%</div>
              </div>
            </div>
            <div class="col-6">
              <p class="mb-1 small text-muted">VirusTotal:</p>
              <div id="vt-stats">
                <span class="badge bg-danger" id="vt-malicious">0</span> / 
                <span id="vt-total">0</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="action-container" class="card-footer d-none">
        <button id="rescan-btn" class="btn btn-sm btn-secondary">
          <i class="fas fa-sync-alt"></i> Rescan
        </button>
        <button id="report-btn" class="btn btn-sm btn-outline-danger">
          <i class="fas fa-exclamation-triangle"></i> Report Phishing
        </button>
      </div>
    </div>

    <!-- Recent phishing URLs -->
    <div class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="mb-0">Recent Phishing Detections</h6>
        <button id="refresh-recent-btn" class="btn btn-sm btn-outline-secondary">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
      <ul id="recent-phishing-list" class="list-group list-group-flush">
        <li class="list-group-item text-center text-muted">
          <small>Loading recent detections...</small>
        </li>
      </ul>
    </div>

    <!-- Footer -->
    <div class="row mt-2 mb-2">
      <div class="col">
        <p class="text-center text-muted small">
          Powered by ML model & VirusTotal
        </p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
